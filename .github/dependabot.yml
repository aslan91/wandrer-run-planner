version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    assignees:
      - "aslan91"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    assignees:
      - "aslan91"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
